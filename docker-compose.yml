services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: khivo-hub-app
    container_name: khivo-hub-app
    command: php-fpm
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - khivo-network

  db:
    image: postgres:16-alpine
    container_name: khivo-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: khivo_db
      POSTGRES_USER: khivo_user
      POSTGRES_PASSWORD: khivo_password
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - khivo-network

  web:
    image: nginx:alpine
    container_name: khivo-hub-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker-nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - khivo-network
    depends_on:
      - app

networks:
  khivo-network:
    driver: bridge

volumes:
  dbdata:
